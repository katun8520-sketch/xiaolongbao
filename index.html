/* 一個畫素風小房間：上方狀態、中間房間舞台、下方動作鍵。白天/夜晚依真實時間切換，不跟隨系統深淺色 */
:root{
  --wall:#fbe4e1; --wall2:#f6d3cf; --wains:#bcd6ee; --wains2:#a6c6e4;
  --floor:#e5bb8c; --floor2:#d9a874; --ink:#4a2c2a; --paper:#fffaf5;
  --cherry:#d9464e; --sky:#9fd3f5; --sky2:#cfeafc; --dim:rgba(20,18,50,0);
  --bar-bg:#f1ddd6; --hunger:#f2a541; --mood:#e8698a; --energy:#6aa8de;
  --pixel:"DotGothic16","PingFang TC","Heiti TC",system-ui,sans-serif;
  --body:"PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
.night{
  --wall:#4b4670; --wall2:#433e66; --wains:#3a4d78; --wains2:#33446c;
  --floor:#6e5670; --floor2:#634d66; --sky:#1b2150; --sky2:#2c3470; --dim:rgba(20,18,50,.18);
}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-bottom:4px solid var(--ink)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.name{font-family:var(--pixel);font-size:26px;letter-spacing:.06em;color:var(--cherry);text-shadow:2px 2px 0 var(--ink)}
.clock{font-family:var(--pixel);font-size:14px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bar{display:flex;flex-direction:column;gap:3px;font-family:var(--pixel);font-size:13px}
.bar .lab{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--bar-bg);border:2px solid var(--ink);position:relative}
.fill{position:absolute;inset:0 auto 0 0;transition:width .6s steps(8)}
.low .track{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:var(--cherry)}}
#stage{flex:1;position:relative;overflow:hidden;min-height:0;
  background:
   linear-gradient(var(--dim),var(--dim)),
   repeating-linear-gradient(90deg,var(--wall) 0 24px,var(--wall2) 24px 48px);}
.wains{position:absolute;left:0;right:0;bottom:30%;height:14%;border-top:4px solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--wains) 0 16px,var(--wains2) 16px 32px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;border-top:4px solid var(--ink);
  background:repeating-linear-gradient(0deg,var(--floor) 0 18px,var(--floor2) 18px 21px)}
.window{position:absolute;top:8%;right:8%;width:26%;max-width:130px;aspect-ratio:1;border:5px solid var(--ink);
  background:linear-gradient(var(--sky2),var(--sky));box-shadow:inset 0 0 0 4px var(--paper)}
.window::before,.window::after{content:"";position:absolute;background:var(--paper)}
.window::before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.window::after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.window .sun{position:absolute;width:26%;aspect-ratio:1;left:18%;top:18%;background:#ffd66b;box-shadow:0 0 0 3px #ffe9a8}
.night .window .sun{background:#fff3c4;box-shadow:none;border-radius:0;clip-path:polygon(40% 0,100% 0,100% 100%,40% 100%,70% 80%,70% 20%)}
.frame{position:absolute;top:12%;left:8%;width:18%;max-width:86px;aspect-ratio:4/5;border:5px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.frame canvas{width:60%;image-rendering:pixelated}
#pet{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);height:min(46%,300px);transition:left 2.2s linear;cursor:pointer;touch-action:manipulation}
#pet img.me{height:100%;display:block;image-rendering:auto;filter:drop-shadow(0 6px 0 rgba(74,44,42,.18))}
#pet.sleeping{height:min(36%,230px)}
#pet.bounce img.me{animation:bounce .5s steps(3)}
@keyframes bounce{40%{transform:translateY(-10%)}}
#bottle{position:absolute;width:18%;left:41%;top:25%;transform:rotate(-35deg);image-rendering:pixelated;pointer-events:none}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:var(--paper);border:3px solid var(--ink);
  padding:6px 12px;font-size:16px;font-weight:700;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:8px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
.zzz{position:absolute;right:6%;top:-4%;font-family:var(--pixel);font-size:22px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);animation:float 2s steps(6) infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.spot{position:absolute;bottom:7%;width:25%;max-width:150px;transform:translateX(-50%);cursor:pointer;border:0;background:none;padding:0}
.spot canvas{width:100%;image-rendering:pixelated;display:block}
.spot.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-54%)}75%{transform:translateX(-46%)}}
.hint{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
footer{background:var(--paper);border-top:4px solid var(--ink);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
footer button{font-family:var(--pixel);font-size:14px;color:var(--ink);background:var(--wall);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:manipulation}
footer button canvas{width:30px;height:30px;image-rendering:pixelated}
footer button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
footer button:disabled{opacity:.4}
footer button:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#pet{transition:none}.zzz,#pet.bounce img.me,.spot.shake,.low .track{animation:none}}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="top"><span class="name">小籠包</span><span class="clock" id="clock">--:--</span></div>
    <div class="bars">
      <div class="bar" id="b-hunger"><div class="lab"><span>肚子</span><span class="v"></span></div><div class="track"><div class="fill" style="background:var(--hunger)"></div></div></div>
      <div class="bar" id="b-mood"><div class="lab"><span>心情</span><span class="v"></span></div><div class="track"><div class="fill" style="background:var(--mood)"></div></div></div>
      <div class="bar" id="b-energy"><div class="lab"><span>精神</span><span class="v"></span></div><div class="track"><div class="fill" style="background:var(--energy)"></div></div></div>
    </div>
  </header>
  <main id="stage">
    <div class="window"><div class="sun"></div></div>
    <div class="frame"><canvas id="frameIcon"></canvas></div>
    <div class="wains"></div><div class="floor"></div>
    <div id="spots"></div>
    <div id="pet"><img class="me" id="me" alt="小籠包"><div class="bubble" id="bubble" hidden></div></div>
    <div class="hint" id="hint" hidden></div>
  </main>
  <footer>
    <button id="a-eat"><canvas data-icon="bowl"></canvas>吃飯</button>
    <button id="a-milk"><canvas data-icon="bottle"></canvas>喝奶</button>
    <button id="a-hug"><canvas data-icon="bunny"></canvas>抱兔兔</button>
    <button id="a-peek"><canvas data-icon="peek"></canvas>躲貓貓</button>
    <button id="a-sleep"><canvas data-icon="moon"></canvas><span id="sleepLab">晚安</span></button>
  </footer>
</div>

(function(){const h=13,w=15,g=[];for(let y=0;y<h;y++){let s='';for(let x=0;x<w;x++){const half=Math.floor((y+1)*w/2/h),c=7;const d=Math.abs(x-c);
 if(d>half+0.01) s+='.'; else if(d>=half-0.99||y==h-1) s+='k'; else if(x==c&&y>h-6) s+='k'; else s+=((x+y)%4==0?'w':'p');} g.push(s);} G.tent=g;})();
function paint(cv,name){const g=G[name];cv.width=g[0].length;cv.height=g.length;const c=cv.getContext('2d');
 g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(PAL[ch]){c.fillStyle=PAL[ch];c.fillRect(x,y,1,1);}}));return cv;}
document.querySelectorAll('canvas[data-icon]').forEach(c=>paint(c,c.dataset.icon));
paint($('frameIcon'),'cherry');
const bottleURL=paint(document.createElement('canvas'),'bottle').toDataURL();

/* ---------- 狀態 ---------- */
const KEY='xlb-pet-v1';
const now=()=>Date.now();
let st={hunger:80,mood:80,energy:80,sleeping:false,milkAt:0,t:now()};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.hunger==='number')st=Object.assign(st,s);}catch(e){}
const clamp=v=>Math.max(0,Math.min(100,v));
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
// 每分鐘的變化：肚子約 6 小時見底、心情約 8 小時、精神約 14 小時；睡覺約 1 小時睡飽
function decay(){const dt=Math.min((now()-st.t)/60000,24*60);st.t=now();
 st.hunger=clamp(st.hunger-dt*0.28);
 if(st.sleeping){st.energy=clamp(st.energy+dt*1.6);st.mood=clamp(st.mood-dt*0.05);}
 else{st.energy=clamp(st.energy-dt*0.12);st.mood=clamp(st.mood-dt*0.2-(st.hunger<25?dt*0.2:0));}}
decay();

/* ---------- 畫面 ---------- */
const pet=$('pet'),me=$('me'),bub=$('bubble');
let lock=0,mode='idle',bubT=0,walkT=0,petX=50;
function pose(k){if(me.dataset.k!==k){me.src=S[k];me.dataset.k=k;}pet.classList.toggle('sleeping',k==='sleep');}
function say(t,ms=2600){bub.textContent=t;bub.hidden=false;clearTimeout(bubT);bubT=setTimeout(()=>bub.hidden=true,ms);}
function bounce(){pet.classList.remove('bounce');void pet.offsetWidth;pet.classList.add('bounce');}
function act(k,text,ms,after){stopWalk();pose(k);if(text)say(text,ms);bounce();lock=now()+ms;clearTimeout(act.t);act.t=setTimeout(()=>{lock=0;after&&after();base();},ms);}
function removeBottle(){const b=$('bottle');b&&b.remove();}
function basePose(){if(st.sleeping)return'sleep';if(st.hunger<25)return'hungry';if(st.mood<25)return'cry';return'idle';}
function base(){if(mode!=='idle'||now()<lock)return;pose(basePose());}
function setBars(){[['hunger',st.hunger],['mood',st.mood],['energy',st.energy]].forEach(([k,v])=>{const el=$('b-'+k);
 el.querySelector('.fill').style.width=v+'%';el.querySelector('.v').textContent=Math.round(v);el.classList.toggle('low',v<25);});
 const sleepBtn=$('a-sleep');$('sleepLab').textContent=st.sleeping?'叫醒':'晚安';
 ['a-eat','a-milk','a-hug','a-peek'].forEach(id=>$(id).disabled=st.sleeping||mode==='peek');sleepBtn.disabled=mode==='peek';}
function isNight(){const h=new Date().getHours();return h>=19||h<7;}
function clock(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');document.body.classList.toggle('night',isNight());}
function zzz(on){let z=pet.querySelector('.zzz');if(on&&!z){z=document.createElement('div');z.className='zzz';z.textContent='Zz';pet.appendChild(z);}if(!on&&z)z.remove();}

/* ---------- 走路 ---------- */
function stopWalk(){clearInterval(walkT);walkT=0;const cur=pet.getBoundingClientRect(),stg=$('stage').getBoundingClientRect();
 if(mode==='idle'){petX=((cur.left+cur.width/2-stg.left)/stg.width)*100;pet.style.transition='none';pet.style.left=petX+'%';void pet.offsetWidth;pet.style.transition='';}}
function walk(){if(mode!=='idle'||now()<lock||st.sleeping||basePose()!=='idle')return;
 const to=20+Math.random()*60;petX=to;pet.style.left=to+'%';let f=0;lock=now()+2200;
 walkT=setInterval(()=>{pose(f++%2?'walk1':'walk2');},260);
 setTimeout(()=>{if(walkT){clearInterval(walkT);walkT=0;lock=0;base();}},2200);}

/* ---------- 動作 ---------- */
const hungryLines=['肚子餓餓…','想吃飯飯'],idleLines=['媽媽～','嘻嘻','來玩嘛','兔兔呢？'];
$('a-eat').onclick=()=>{decay();
 if(st.hunger>90)return act('angry','生氣！吃飽了啦！',2200);
 act('eat','好好吃！',2600,()=>{st.hunger=clamp(st.hunger+30);st.mood=clamp(st.mood+5);refresh();act('happy','吃飽飽！',1600);});};
$('a-milk').onclick=()=>{decay();
 act('surprise','咕嚕咕嚕…',3000,()=>{removeBottle();st.milkAt=now();st.hunger=clamp(st.hunger+10);refresh();
   act('happy',st.energy<70||isNight()?'喝完了～想睡覺覺':'喝完了！',2000);});
 const b=new Image();b.id='bottle';b.src=bottleURL;b.alt='';pet.appendChild(b);};
$('a-hug').onclick=()=>{decay();
 if(st.hunger<25)return act('hungry','肚子餓，不想玩…',2200);
 st.mood=clamp(st.mood+15);st.energy=clamp(st.energy-4);refresh();act('hug','兔兔抱抱！',2600);};
$('a-sleep').onclick=()=>{decay();
 if(st.sleeping){st.sleeping=false;zzz(false);refresh();
   if(st.energy<60){st.mood=clamp(st.mood-10);return act('cry','嗚嗚…還想睡…',2600);}
   return act('cheer','早安！',2000);}
 if(now()-st.milkAt>20*60000)return act('angry','生氣！要先喝奶奶！',2600);
 stopWalk();st.sleeping=true;refresh();pose('sleep');zzz(true);say('晚安…',1800);};

/* 點她：隨機反應；連點三下她會雙手交叉說「生氣！」 */
let taps=[];
pet.onclick=()=>{if(mode==='peek')return;
 if(st.sleeping){say('Zzz…',1200);return;}
 taps=taps.filter(t=>now()-t<1500);taps.push(now());
 if(taps.length>=3){taps=[];return act('angry','生氣！',2200);}
 if(now()<lock)return;decay();st.mood=clamp(st.mood+3);refresh();
 const r=Math.random();r<.5?act('happy','嘻嘻！',1500):act('cheer',['媽媽！','抱抱！','耶～'][Math.floor(Math.random()*3)],1500);};

/* ---------- 躲貓貓 ---------- */
const SPOTS=[['box',20,'紙箱'],['sofa',50,'沙發'],['tent',80,'帳篷']];
$('a-peek').onclick=()=>{decay();
 if(st.hunger<25)return act('hungry','肚子餓，不想玩…',2200);
 if(st.energy<15)return act('idle','好睏喔…',2200);
 stopWalk();mode='peek';clearTimeout(act.t);lock=0;refresh();
 act.t=0;pose('cheer');say('我要躲起來囉！',1400);
 setTimeout(()=>{pet.hidden=true;const hide=Math.floor(Math.random()*3),box=$('spots');box.innerHTML='';let tries=0;
  $('hint').textContent='小籠包躲在哪裡？';$('hint').hidden=false;
  SPOTS.forEach(([g,x,label],i)=>{const b=document.createElement('button');b.className='spot';b.style.left=x+'%';b.setAttribute('aria-label',label);
   b.appendChild(paint(document.createElement('canvas'),g));
   b.onclick=()=>{if(mode!=='peek')return;tries++;
    if(i===hide){box.innerHTML='';$('hint').hidden=true;petX=x;pet.style.transition='none';pet.style.left=x+'%';void pet.offsetWidth;pet.style.transition='';pet.hidden=false;
      mode='idle';st.mood=clamp(st.mood+(tries===1?25:18));st.energy=clamp(st.energy-8);st.hunger=clamp(st.hunger-4);refresh();
      act('surprise','哇！被你找到了！',1600,()=>act('cheer','再玩一次！',1800));}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('hint').textContent='嘻嘻～不在'+label+'裡面';}};
   box.appendChild(b);});
  refresh();},1400);};

/* ---------- 主迴圈 ---------- */
function refresh(){setBars();save();}
function tick(){decay();clock();
 if(st.sleeping&&st.energy>=100){st.sleeping=false;zzz(false);act('cheer','睡飽飽！早安！',2400);}
 refresh();if(mode!=='idle')return;
 if(st.sleeping){pose('sleep');zzz(true);return;}
 if(now()<lock)return;base();
 if(Math.random()<.12){const bp=basePose();
  if(bp==='hungry')say(hungryLines[Math.floor(Math.random()*2)]);
  else if(bp==='cry')say('嗚嗚…陪我玩');
  else if(st.energy<25||(isNight()&&st.energy<60))say(now()-st.milkAt<20*60000?'想睡覺覺…':'要喝奶奶…');
  else if(Math.random()<.5)walk(); else say(idleLines[Math.floor(Math.random()*idleLines.length)],2000);}
}
clock();pose(basePose());if(st.sleeping)zzz(true);refresh();
setTimeout(()=>{if(!st.sleeping)say(isNight()?'媽媽晚安～':'媽媽！',2200);},600);
setInterval(tick,1000);
</script>
